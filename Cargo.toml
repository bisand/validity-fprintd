[package]
name = "validity-fprintd"
version = "0.1.1"
edition = "2021"
description = "Rust driver for Synaptics/Validity match-on-chip fingerprint sensors (06cb:009a and friends)"
license = "MIT"
repository = "https://github.com/bisand/validity-fprintd"

[features]
# Build libusb from source and link it statically. Used for portable release
# binaries that must run on any distribution, musl-based ones included.
# Distribution packages should leave this off and link the system libusb.
vendored = ["rusb/vendored"]

[dependencies]
rusb = "0.9"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
anyhow = "1"
hex = "0.4"
libc = "0.2"
zbus = { version = "4", features = ["tokio"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

