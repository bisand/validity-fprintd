name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross builds in a container that already has the musl toolchain, which
      # matters because the vendored libusb is C and needs a musl cross compiler.
      - name: Install cross
        run: cargo install cross --locked

      # Statically linked against musl with libusb built from source, so the
      # result runs on any distribution regardless of libc or libusb version.
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} --features vendored

      - name: Verify the binary is static
        run: |
          F="target/${{ matrix.target }}/release/validity-fprintd"
          file "$F"
          if file "$F" | grep -q "dynamically linked"; then
            echo "::error::binary is dynamically linked; it will not be portable"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(git rev-parse --short HEAD)"
          NAME="validity-fprintd-${VERSION}-${{ matrix.target }}"

          mkdir -p "dist/$NAME/bin" "dist/$NAME/share"
          for b in validity-fprintd validity-probe validity-session validity-db \
                   validity-sensor validity-verify validity-baseline \
                   validity-firmware validity-provision; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$NAME/bin/"
          done

          cp packaging/validity-fprintd.service "dist/$NAME/share/"
          cp packaging/openrc/validity-fprintd "dist/$NAME/share/validity-fprintd.openrc"
          cp udev/70-validity-fprintd.rules "dist/$NAME/share/"
          cp scripts/fetch-firmware.sh "dist/$NAME/share/"
          cp README.md LICENSE "dist/$NAME/"

          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
