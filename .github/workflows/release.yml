name: release

# Builds when a GitHub Release is published, so the release notes are written
# by hand rather than generated from commit subjects. The binaries are attached
# to the release that triggered the run.
#
# workflow_dispatch builds an existing tag without touching any release, which
# is useful for checking a build before publishing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (no release assets are uploaded)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross builds in a container that already carries the musl toolchain and
      # Linux uapi headers, which the vendored libusb needs to compile.
      - name: Install cross
        run: cargo install cross --locked

      # Statically linked against musl with libusb built from source, so the
      # result runs on any distribution regardless of libc or libusb version.
      #
      # Do not override the Rust linker here. Pointing it at musl-gcc produces a
      # dynamic PIE that still needs /lib/ld-musl-*.so at runtime; letting rustc
      # link with its own self-contained CRT objects yields a static-pie, which
      # is self-contained and keeps ASLR.
      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cross build --release --locked --target ${{ matrix.target }} --features vendored

      # "Statically linked" from ldd is not enough: a binary can have no shared
      # libraries yet still carry a PT_INTERP entry naming the musl loader, in
      # which case it fails to exec anywhere musl is not installed.
      - name: Verify the binaries are self-contained
        run: |
          for b in validity-fprintd validity-probe validity-session validity-db \
                   validity-sensor validity-verify validity-baseline \
                   validity-firmware validity-provision; do
            F="target/${{ matrix.target }}/release/$b"
            if readelf -l "$F" | grep -q INTERP; then
              echo "::error::$b requests a program interpreter and will not run without it"
              exit 1
            fi
            if readelf -d "$F" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$b has shared library dependencies"
              exit 1
            fi
            echo "$b: self-contained"
          done

      - name: Package
        id: package
        run: |
          VERSION="${TAG#v}"
          NAME="validity-fprintd-${VERSION}-${{ matrix.target }}"
          BINS="validity-fprintd validity-probe validity-session validity-db
                validity-sensor validity-verify validity-baseline
                validity-firmware validity-provision"

          mkdir -p "dist/$NAME/bin" "dist/$NAME/share" out
          for b in $BINS; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$NAME/bin/"
          done

          cp packaging/validity-fprintd.service "dist/$NAME/share/"
          cp packaging/openrc/validity-fprintd "dist/$NAME/share/validity-fprintd.openrc"
          cp udev/70-validity-fprintd.rules "dist/$NAME/share/"
          cp scripts/fetch-firmware.sh "dist/$NAME/share/"
          cp README.md LICENSE "dist/$NAME/"

          # The tarball is what install.sh falls back to: one download that also
          # carries the service files, udev rules and firmware script.
          tar -C dist -czf "out/$NAME.tar.gz" "$NAME"

          # Native packages install to /usr/bin, not /usr/local/bin where the
          # tarball lands, so the service files need rewriting for them.
          sed 's|/usr/local/bin/|/usr/bin/|' packaging/validity-fprintd.service \
            > dist/validity-fprintd.service
          sed 's|/usr/local/bin/|/usr/bin/|' packaging/openrc/validity-fprintd \
            > dist/validity-fprintd.openrc

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # deb, rpm and apk carrying the static binaries, so one artifact per
      # format works on every version of a distribution family. The recipes in
      # packaging/{aur,fedora,alpine} link the system libusb instead and are
      # what belongs in a distribution's own repository.
      - name: Build native packages
        env:
          VERSION: ${{ steps.package.outputs.version }}
          BINDIR: dist/${{ steps.package.outputs.name }}/bin
        run: |
          NFPM_VERSION="$(curl -sfL https://api.github.com/repos/goreleaser/nfpm/releases/latest \
            | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)"
          [ -n "$NFPM_VERSION" ] || { echo "::error::could not resolve the latest nfpm"; exit 1; }
          echo "using nfpm $NFPM_VERSION"
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm

          case "${{ matrix.target }}" in
            x86_64-*)  export ARCH=amd64 ;;
            aarch64-*) export ARCH=arm64 ;;
            *) echo "::error::no package arch for ${{ matrix.target }}"; exit 1 ;;
          esac

          for fmt in deb rpm apk; do
            nfpm package -f packaging/nfpm/nfpm.yaml -p "$fmt" -t out/
          done
          ls -l out/

      - name: Checksum every artifact
        run: |
          # One checksum file per target; the publish job concatenates them.
          ( cd out && sha256sum -- * > "../SHA256SUMS-${{ matrix.target }}" )
          mv "SHA256SUMS-${{ matrix.target }}" out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/*

  publish:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    # Only a published release has somewhere to put the assets.
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS-<target> arrives per build job; merge them into the single
      # SHA256SUMS that install.sh looks for.
      - name: Collect checksums
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          rm -f dist/SHA256SUMS-*
          cat dist/SHA256SUMS

      # Upload rather than create, so the notes written on the release are kept.
      - name: Attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
