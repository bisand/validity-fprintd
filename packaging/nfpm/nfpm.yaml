# nfpm config for the .deb / .rpm / .apk / .pkg.tar.zst release assets.
#
#   Stage the binaries in ./dist/bin and the service files in ./dist, then:
#   VERSION=0.1.1 ARCH=amd64 nfpm package -f packaging/nfpm/nfpm.yaml -p deb -t out/
#
# Paths here are literal: nfpm expands environment variables in fields like
# version and arch, but not inside contents[].src.
#
# These packages carry the statically linked binaries, so one artifact works on
# every version of a distribution family. That trades away using the system
# libusb; the recipes in packaging/{aur,fedora,alpine} link dynamically and are
# the right thing for a distribution's own repository.
#
# Per-file `packager:` selects which format an entry goes into. Do not use
# `overrides.<fmt>.contents` for this: an override replaces the whole contents
# list rather than adding to it, which would ship a package with nothing but
# the service file in it.

name: validity-fprintd
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: André Biseth <andre@biseth.net>
vendor: André Biseth
homepage: https://github.com/bisand/validity-fprintd
license: MIT
description: |
  Fingerprint driver for Synaptics/Validity match-on-chip sensors.
  A Rust driver and fprintd-compatible D-Bus daemon for the sensor family that
  stock libfprint does not support. It serves the same D-Bus interface as
  fprintd, so pam_fprintd and the standard fprintd clients work unchanged.
  Binaries are statically linked and depend only on a running D-Bus.

depends:
  - dbus

contents:
  - src: ./dist/bin/validity-fprintd
    dst: /usr/bin/validity-fprintd
  - src: ./dist/bin/validity-probe
    dst: /usr/bin/validity-probe
  - src: ./dist/bin/validity-session
    dst: /usr/bin/validity-session
  - src: ./dist/bin/validity-db
    dst: /usr/bin/validity-db
  - src: ./dist/bin/validity-sensor
    dst: /usr/bin/validity-sensor
  - src: ./dist/bin/validity-verify
    dst: /usr/bin/validity-verify
  - src: ./dist/bin/validity-baseline
    dst: /usr/bin/validity-baseline
  - src: ./dist/bin/validity-firmware
    dst: /usr/bin/validity-firmware
  - src: ./dist/bin/validity-provision
    dst: /usr/bin/validity-provision

  - src: ./udev/70-validity-fprintd.rules
    dst: /usr/lib/udev/rules.d/70-validity-fprintd.rules
  - src: ./scripts/fetch-firmware.sh
    dst: /usr/share/validity-fprintd/fetch-firmware.sh
    file_info:
      mode: 0755
  - src: ./README.md
    dst: /usr/share/doc/validity-fprintd/README.md
  - src: ./LICENSE
    dst: /usr/share/doc/validity-fprintd/LICENSE

  # systemd distributions get the unit.
  - src: ./dist/validity-fprintd.service
    dst: /usr/lib/systemd/system/validity-fprintd.service
    packager: deb
  - src: ./dist/validity-fprintd.service
    dst: /usr/lib/systemd/system/validity-fprintd.service
    packager: rpm
  - src: ./dist/validity-fprintd.service
    dst: /usr/lib/systemd/system/validity-fprintd.service
    packager: archlinux

  # Alpine uses OpenRC.
  - src: ./dist/validity-fprintd.openrc
    dst: /etc/init.d/validity-fprintd
    file_info:
      mode: 0755
    packager: apk

scripts:
  postinstall: ./packaging/nfpm/postinstall.sh
  preremove: ./packaging/nfpm/preremove.sh
  postremove: ./packaging/nfpm/postremove.sh

overrides:
  # The AUR recipe builds the same software against the system libusb, so only
  # one of the two should ever be installed.
  archlinux:
    conflicts:
      - validity-fprintd-git
    provides:
      - validity-fprintd
